[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fleetwatcher-mcp"
version = "0.1.0"
description = "Internal fleet pulse — monitor repos, builds, sessions, and supply chain"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.139.0",
    "fastmcp>=3.4.4,<4",
    "httpx",
]

[project.entry-points."mcp.server"]
fleetwatcher = "fleetwatcher_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/fleetwatcher_mcp"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["S104", "S310", "S311", "S314", "S608", "S108", "S603", "S301", "B008", "B904", "C901", "UP035", "RUF006", "N806", "E501", "F841", "PLW1510", "BLE001", "RUF022", "E402", "F811", "B006", "B007", "RUF059", "RUF001", "RUF002", "S110", "RUF012", "DTZ005", "E741", "SIM115", "SIM102", "RUF100", "F401", "S104", "S310", "S311", "S314", "S608", "B008", "B904", "C901", "UP035", "RUF006", "N806", "E501", "F841", "PLW1510", "BLE001", "RUF022", "E402", "F811", "B006", "B007", "RUF059", "RUF001", "RUF002", "S110", "RUF012", "S104", "S310", "S311", "S314", "S608", "S604", "E402", "B008", "B904", "E501"]

[tool.ruff.format]
quote-style = "double"

[dependency-groups]
dev = [
    "pillow>=12.3.0",
    "pytesseract>=0.3.13",
    "pywinauto>=0.6.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.16.0,<0.17"]
